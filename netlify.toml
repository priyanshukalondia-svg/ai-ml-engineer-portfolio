[build]
  # Directory with the website source
  base = "."
  
  # Build command for TanStack Start with Nitro
  command = "npm run build"
  
  # Directory that will be deployed (Nitro output for Netlify)
  publish = ".output/public"
  
  # Functions directory for Netlify Functions
  functions = ".output/server"

# Environment variables
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirect rules for SPA routing - Nitro handles this but backup for static assets
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
